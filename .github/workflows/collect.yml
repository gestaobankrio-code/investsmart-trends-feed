name: Atualizar InvestSmart Trends

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "collector/**"
      - ".github/workflows/collect.yml"
  schedule:
    - cron: "15 15 * * *"

permissions:
  contents: write
  id-token: write

concurrency:
  group: investsmart-trends-refresh
  cancel-in-progress: false

jobs:
  configuration:
    if: ${{ vars.GCP_PROJECT_ID == '' || vars.GCP_WORKLOAD_IDENTITY_PROVIDER == '' || vars.GCP_SERVICE_ACCOUNT == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Informar configuração pendente
        run: |
          echo "::error::Coleta não configurada. Defina GCP_PROJECT_ID, GCP_WORKLOAD_IDENTITY_PROVIDER e GCP_SERVICE_ACCOUNT em Settings > Secrets and variables > Actions > Variables."
          exit 1

  refresh:
    if: ${{ vars.GCP_PROJECT_ID != '' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Autenticar no Google Cloud sem chave permanente
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Configurar Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          install_components: bq

      - name: Coletar Google Trends
        run: node collector/collect.mjs

      - name: Validar feed
        run: node collector/validate.mjs

      - name: Verificar freshness após coleta
        id: freshness
        # A fonte pode não trazer os termos financeiros diariamente; a falta de
        # novidade é alerta de dados, não falha de autenticação/coleta.
        continue-on-error: true
        run: node collector/check-freshness.mjs --max-days=3

      - name: Registrar alerta de dados antigos
        if: steps.freshness.outcome == 'failure'
        run: |
          echo "::warning::O Google Trends público não trouxe termos financeiros com até 3 dias. Os dados reais serão publicados com a data original e sinalizados como históricos."
          echo "### Atenção: fonte Google Trends desatualizada" >> "$GITHUB_STEP_SUMMARY"
          echo "A coleta foi executada, mas a fonte não possui termos curados recentes. O feed conserva datas reais e a rotina de monitoramento abre alerta." >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar atualização
        run: |
          if git diff --quiet -- docs/data/trends.json docs/data/status.json; then
            echo "Feed sem alteração material."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/trends.json docs/data/status.json
          git commit -m "data: atualizar InvestSmart Trends $(date -u +%F)"
          git push origin HEAD:main
