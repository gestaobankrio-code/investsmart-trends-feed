name: Avaliar classificação semântica
on:
  push:
    branches: [main]
    paths:
      - "collector/classify-finance.mjs"
      - "collector/classifier-check.mjs"
      - ".github/workflows/classifier-eval.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Instalar modelo local de classificação
        run: npm install --no-save --no-package-lock --ignore-scripts @huggingface/transformers@3.8.1
      - name: Executar avaliação sem alterar o feed público
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: node collector/classifier-check.mjs
