name: Validar feed e coletor

on:
  push:
    branches:
      - main
      - "prod/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validar sintaxe do coletor
        run: |
          node --check collector/finance-relevance.mjs
          node --check collector/test-finance-relevance.mjs
          node --check collector/collect.mjs
          node --check collector/test-no-predefined.mjs
          node --check collector/validate.mjs
          node --check collector/check-freshness.mjs

      - name: Garantir ausência de termos pré-selecionados
        run: node collector/test-no-predefined.mjs

      - name: Testar classificação por domínio financeiro
        run: node collector/test-finance-relevance.mjs

      - name: Validar feed versionado
        run: node collector/validate.mjs
